<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-DM3ZPBMBXE"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-DM3ZPBMBXE');
  </script>
  <title>Match History | Restoration Tennis Ladder</title>
  <link rel="stylesheet" href="style.css?v=18">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="header-brand">
        <img src="images/logo.png" alt="Restoration Tennis Ladder logo" class="header-logo">
        <span class="header-title">Restoration Tennis Ladder</span>
      </a>
      <nav class="desktop-nav">
        <a href="index.html">Home</a>
        <a href="rules.html">About</a>
        <a href="join.html">Join</a>
        <a href="ladder.html">Rankings</a>
        <a href="report.html">Report Match</a>
        <a href="history.html">Match History</a>
        <a href="events.html">Events</a>
        <a href="photos.html">Photos</a>
        <a href="contacts.html">Directory</a>
      </nav>
      <button class="hamburger-btn" aria-label="Open menu" aria-expanded="false">☰</button>
    </div>
    <div class="mobile-nav-menu" aria-hidden="true">
      <a href="index.html">Home</a>
      <a href="rules.html">About</a>
      <a href="join.html">Join</a>
      <a href="ladder.html">Rankings</a>
      <a href="report.html">Report Match</a>
      <a href="history.html" class="active">Match History</a>
      <a href="events.html">Events</a>
      <a href="photos.html">Photos</a>
      <a href="contacts.html">Directory</a>
    </div>
  </header>

  <main>
    <div id="match-of-week" style="display:none;"></div>

    <section class="card">
      <div class="section-header">
        <div>
          <h2>Match History</h2>
          <p class="small-text">Most recent results appear first.</p>
        </div>
      </div>

      <div class="history-toolbar">
        <div class="history-filters premium-filters">
          <button type="button" class="filter-chip active" data-filter="All">All</button>
          <button type="button" class="filter-chip" data-filter="Singles">Singles</button>
          <button type="button" class="filter-chip" data-filter="Doubles">Doubles</button>
          <button type="button" class="filter-chip" data-filter="Drop-In">Drop-In</button>
          <button type="button" class="filter-chip" data-filter="retired">🏳️ Incomplete</button>
        </div>

        <div class="history-search-wrap">
          <input
            type="text"
            id="history-player-filter"
            placeholder="Search by player name"
            autocomplete="off"
          >
        </div>
      </div>

      <div id="history-list">
        <p>Loading match history...</p>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js?v=21"></script>
<script>
  (function() {
    var p = location.pathname.split('/').pop() || 'index.html';
    document.querySelectorAll('.desktop-nav a').forEach(function(a) {
      if (a.getAttribute('href').split('/').pop() === p) a.classList.add('nav-active');
    });
  }());
</script>
</body>
</html>
