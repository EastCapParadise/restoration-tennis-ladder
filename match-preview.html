<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Match Preview | Restoration Tennis Ladder</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0e1a13;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 14px 48px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #18201c;
      overflow-x: hidden;
    }

    /* ── Card shell ─────────────────────────────────── */
    .preview-card {
      width: 100%;
      max-width: min(390px, 100vw);
      background: #f7faf8;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.55);
    }

    /* ── Card header bar ────────────────────────────── */
    .pc-header {
      background: linear-gradient(135deg, #16392b 0%, #1f4d3a 55%, #1f3558 100%);
      padding: 14px 16px 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .pc-brand {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.1px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.82);
    }

    .pc-badge {
      background: rgba(255,255,255,0.18);
      color: white;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.6px;
      padding: 3px 10px;
      border-radius: 20px;
      text-transform: uppercase;
    }

    /* ── Title section ──────────────────────────────── */
    .pc-title-block {
      background: linear-gradient(135deg, #1f4d3a 0%, #1a3d2f 100%);
      padding: 18px 18px 16px;
      text-align: center;
    }

    .pc-eyebrow {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.65);
      margin-bottom: 7px;
    }

    .pc-main-title {
      font-size: 26px;
      font-weight: 900;
      color: white;
      line-height: 1.15;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .pc-prob-line {
      font-size: 12px;
      color: rgba(255,255,255,0.75);
      font-weight: 500;
    }

    /* ── Teams section ──────────────────────────────── */
    .pc-teams {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 0;
      background: #e9f3ee;
      padding: 16px 14px;
      border-bottom: 1px solid #d2e5da;
      width: 100%;
    }

    .pc-team {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
      align-items: flex-start; /* shrink badges to content width — prevents rank pill stretching */
    }

    .pc-team.right {
      text-align: right;
      align-items: flex-end;
    }

    .pc-team-name {
      font-size: 13px;
      font-weight: 700;
      color: #18201c;
      line-height: 1.2;
    }

    .pc-team-name + .pc-team-name {
      margin-top: 6px;
    }

    .pc-team-rank {
      font-size: 10px;
      font-weight: 600;
      color: #1f4d3a;
      background: rgba(31,77,58,0.12);
      padding: 2px 6px;
      border-radius: 4px;
      display: inline-block;
      margin-top: 1px;
    }

    .pc-team-rating {
      font-size: 11px;
      color: #66736c;
      font-weight: 500;
      margin-top: 1px;
    }

    .pc-team-pts {
      font-size: 14px;
      font-weight: 800;
      color: #1f4d3a;
      margin-top: 2px;
    }

    .pc-team-avg {
      font-size: 13px;
      font-weight: 800;
      color: #1f4d3a;
      margin-bottom: 6px;
    }

    .pc-vs {
      font-size: 11px;
      font-weight: 800;
      color: #66736c;
      letter-spacing: 1px;
      padding: 0 8px;
      text-align: center;
      min-width: 0;
    }

    /* Second player in a doubles column */
    .pc-team-separator {
      border-top: 1px dashed #c4d8cb;
      margin: 7px 0;
      width: 100%;   /* must span full column — overrides flex-start shrink */
      align-self: stretch;
    }

    /* ── Scenarios ──────────────────────────────────── */
    .pc-scenarios-label {
      padding: 12px 16px 8px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.1px;
      text-transform: uppercase;
      color: #66736c;
      background: #f7faf8;
    }

    .pc-scenarios-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding: 0 10px 10px;
      background: #f7faf8;
      width: 100%;
    }

    .pc-scenario {
      border-radius: 12px;
      padding: 11px 11px 10px;
      min-width: 0;
      overflow: hidden;
      word-break: break-word;
    }

    .pc-scenario.blue {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
    }

    .pc-scenario.amber {
      background: #fffbeb;
      border: 1px solid #fde68a;
    }

    .pc-sc-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }

    .pc-scenario.blue  .pc-sc-label { color: #1d4ed8; }
    .pc-scenario.amber .pc-sc-label { color: #b45309; }

    .pc-sc-score {
      font-size: 12px;
      font-weight: 600;
      color: #18201c;
      margin-bottom: 7px;
    }

    .pc-sc-row {
      font-size: 11px;
      color: #374151;
      line-height: 1.5;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pc-sc-prob {
      font-size: 9px;
      color: #66736c;
      font-weight: 500;
      margin-bottom: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pc-sc-pts-earned {
      font-weight: 700;
    }

    .pc-sc-pts-total {
      color: #66736c;
    }

    /* ── Footer ─────────────────────────────────────── */
    .pc-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(135deg, #16392b 0%, #1f4d3a 100%);
      padding: 11px 14px;
      gap: 8px;
    }

    .pc-footer-left {
      font-size: 10px;
      color: rgba(255,255,255,0.7);
      font-weight: 500;
      line-height: 1.35;
      flex: 1;
    }

    .pc-footer-right {
      font-size: 10px;
      color: rgba(255,255,255,0.55);
      font-weight: 600;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }

    /* ── Screenshot hint ────────────────────────────── */
    .screenshot-hint {
      margin-top: 16px;
      font-size: 11px;
      color: rgba(255,255,255,0.22);
      text-align: center;
      letter-spacing: 0.3px;
    }

    /* ── Error state ────────────────────────────────── */
    .error-state {
      color: rgba(255,255,255,0.6);
      text-align: center;
      padding: 48px 24px;
      font-size: 15px;
    }

    .error-state a {
      color: #4ade80;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="preview-card" id="preview-card">
    <div class="error-state">Loading preview…</div>
  </div>
  <div class="screenshot-hint">📱 Screenshot this page to share</div>

<script>
/* ─── Scoring formula (mirrors production calculateMatchScoring) ─── */

function adjTeamRating(players, isMixed) {
  const v = players.filter(Boolean);
  if (!v.length) return 0;
  return v.reduce((s, p) => s + p.rating + (isMixed && p.sex === 'Man' ? 0.5 : 0), 0) / v.length;
}

function calcPoints(wStd, lStd, wAdj, lAdj) {
  const gap     = Math.min(Math.abs(wAdj - lAdj), 0.5);
  const expSprd = wAdj >= lAdj ? gap * 16 : -(gap * 16);
  const delta   = (wStd - lStd) - expSprd;

  let wp = Math.max(8, Math.min(18, Math.round(11 + delta * 0.29)));

  let lp;
  if (lStd === 0) {
    lp = Math.max(5, Math.round(4 + gap * 4));
  } else {
    const eComp = lAdj > wAdj ? -(gap * 6) : lAdj < wAdj ? +(gap * 4) : 0;
    lp = Math.max(5, Math.round(4 + lStd * 0.6 + eComp));
  }

  lp = Math.min(lp, wp - 2);
  lp = Math.max(5, lp);
  if (wp - lp < 2) wp = lp + 2;
  return { wp, lp };
}

function toScore(wStd, lStd) {
  const lps = Math.floor(lStd / 2);
  const ext = lStd % 2;
  return `6-${lps + ext}, 6-${lps}`;
}

function firstName(name) {
  return (name || '').trim().split(' ')[0] || name;
}

function lastName(name) {
  const p = (name || '').trim().split(' ');
  return p[p.length - 1] || name;
}

// Returns {id -> displayName}: unique first names stay as first name, shared ones get "First L."
function disambiguateNames(playerObjects) {
  const firstNames = {};
  playerObjects.forEach(p => {
    if (!p || !p.name) return;
    const first = p.name.trim().split(/\s+/)[0];
    if (!firstNames[first]) firstNames[first] = [];
    firstNames[first].push(p);
  });
  const displayNames = {};
  playerObjects.forEach(p => {
    if (!p || !p.name) return;
    const parts = p.name.trim().split(/\s+/);
    const first = parts[0];
    const lastInitial = parts[parts.length - 1]?.[0] || '';
    if (firstNames[first].length > 1) {
      // Shared first name — use "First L." to disambiguate
      displayNames[p.id] = lastInitial ? `${first} ${lastInitial}.` : p.name;
    } else {
      // Unique first name — use full name
      displayNames[p.id] = p.name;
    }
  });
  return displayNames;
}

function teamTitle(players, dispNames) {
  const d = p => (dispNames && dispNames[p.id]) || firstName(p.name);
  if (players.length === 1) return d(players[0]);
  const last0 = lastName(players[0].name);
  const last1 = lastName(players[1].name);
  if (last0 === last1) return last0 + 's';
  return `${d(players[0])} & ${d(players[1])}`;
}

function teamShortName(players) {
  return players.map(p => lastName(p.name)).join('/');
}

function rankLabel(r) {
  return r ? `#${r}` : '—';
}

function esc(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ─── Main render ─── */

function render(data) {
  const { matchType, team1, team2, watcher } = data;
  const isDoubles = matchType === 'doubles';

  const hasMen   = [...team1, ...team2].some(p => p.sex === 'Man');
  const hasWomen = [...team1, ...team2].some(p => p.sex === 'Woman');
  const isMixed  = hasMen && hasWomen;

  /* Match type label */
  let typeLabel;
  if (!isDoubles) {
    typeLabel = 'Singles';
  } else if (isMixed) {
    typeLabel = 'Mixed Doubles';
  } else if (hasMen) {
    typeLabel = "Men's Doubles";
  } else {
    typeLabel = "Women's Doubles";
  }

  /* Per-match name disambiguation — shared first names get "First L." */
  const matchDispNames = disambiguateNames([...team1, ...team2].filter(Boolean));

  /* Team adjusted ratings */
  const r1 = adjTeamRating(team1, isMixed);
  const r2 = adjTeamRating(team2, isMixed);

  /* Who's the favorite? */
  const favTeam = r1 >= r2 ? team1 : team2;
  const undTeam = r1 >= r2 ? team2 : team1;
  const favAdj  = Math.max(r1, r2);
  const undAdj  = Math.min(r1, r2);
  const gapMag  = Math.min(Math.abs(favAdj - undAdj), 0.5);

  /* Win probability */
  const prob1   = 1 / (1 + Math.pow(10, (r2 - r1) / 0.45));
  const favProb = r1 >= r2 ? prob1 : 1 - prob1;
  const favPct  = Math.round(favProb * 100);

  /* ── Gap-aware scenario generation ─────────────────────────────── */

  // Expected game spread from the favorite's perspective (positive = fav wins)
  const expSpread = gapMag * 16;

  // Map absolute game spread to game counts and a display score string
  function spreadToGameCounts(absSpread) {
    const a = Math.round(absSpread);
    if (a >= 10) return { w: 12, l: 2,  score: '6-1, 6-1' };
    if (a === 9)  return { w: 12, l: 3,  score: '6-2, 6-1' };
    if (a === 8)  return { w: 12, l: 4,  score: '6-2, 6-2' };
    if (a === 7)  return { w: 12, l: 5,  score: '6-3, 6-2' };
    if (a === 6)  return { w: 12, l: 6,  score: '6-3, 6-3' };
    if (a === 5)  return { w: 12, l: 7,  score: '6-4, 6-3' };
    if (a === 4)  return { w: 12, l: 8,  score: '6-4, 6-4' };
    if (a === 3)  return { w: 13, l: 10, score: '7-6, 6-4' };
    if (a === 2)  return { w: 13, l: 11, score: '7-5, 6-4' };
    if (a === 1)  return { w: 13, l: 12, score: '7-6, 7-5' };
    return               { w: 13, l: 13, score: '7-6, 7-6' };
  }

  // Build one scenario from a target spread (positive = fav wins, negative = und wins)
  // Returns wAdj/lAdj so enforcement can recompute points after overriding game counts
  function buildScenario(targetSpread) {
    const favWins  = targetSpread > 0;
    const { w, l, score } = spreadToGameCounts(Math.abs(targetSpread));
    const winTeam  = favWins ? favTeam : undTeam;
    const loseTeam = favWins ? undTeam : favTeam;
    const wAdj     = favWins ? favAdj  : undAdj;
    const lAdj     = favWins ? undAdj  : favAdj;
    const { wp, lp } = calcPoints(w, l, wAdj, lAdj);
    return { targetSpread, favWins, score, w, l, winTeam, loseTeam, wAdj, lAdj, wp, lp };
  }

  // Reverse lookup: given a loser game count, return { w, l, score }
  function lToGameCounts(l) {
    const map = {
      2:  { w: 12, score: '6-1, 6-1' }, 3:  { w: 12, score: '6-2, 6-1' },
      4:  { w: 12, score: '6-2, 6-2' }, 5:  { w: 12, score: '6-3, 6-2' },
      6:  { w: 12, score: '6-3, 6-3' }, 7:  { w: 12, score: '6-4, 6-3' },
      8:  { w: 12, score: '6-4, 6-4' }, 9:  { w: 13, score: '7-5, 6-4' },
      10: { w: 13, score: '7-6, 6-4' }, 11: { w: 13, score: '7-5, 6-4' },
      12: { w: 13, score: '7-6, 7-5' }, 13: { w: 13, score: '7-6, 7-6' },
    };
    const e = map[l] || map[2];
    return { w: e.w, l, score: e.score };
  }

  // A = fav wins convincingly   |  B = fav wins close
  // C = underdog wins close     |  D = underdog wins convincingly
  // A and B are always positive → favWins=true. C and D are always negative → favWins=false.
  // Result: always exactly 2 fav-win scenarios and 2 underdog-win scenarios.
  const tSpreads = [
    expSpread + 4,              // A: fav wins above expectation
    Math.max(2, expSpread - 4), // B: fav wins close (≥+2 so always positive)
    -4,                         // C: fixed — underdog wins close
    -(expSpread + 4),           // D: mirror of A — underdog wins convincingly
  ];

  const scenarios = tSpreads.map(sp => buildScenario(sp));

  // Enforce: C's loser must have ≥2 more games than D's loser
  // (C is the closer upset; D is the dominant one — they must be visually distinct)
  if (scenarios[2].l < scenarios[3].l + 2) {
    const gc = lToGameCounts(scenarios[3].l + 2);
    const { wp, lp } = calcPoints(gc.w, gc.l, scenarios[2].wAdj, scenarios[2].lAdj);
    scenarios[2] = { ...scenarios[2], ...gc, wp, lp };
  }

  // Enforce: no two scenarios share both the same winner direction and the same scoreline bucket
  // If they do, bump the later scenario's loser-game count up by 2 (closer/tighter result)
  for (let attempt = 0; attempt < 20; attempt++) {
    let changed = false;
    for (let i = 1; i < 4; i++) {
      for (let j = 0; j < i; j++) {
        if (scenarios[i].favWins === scenarios[j].favWins &&
            scenarios[i].w === scenarios[j].w &&
            scenarios[i].l === scenarios[j].l) {
          const gc = lToGameCounts(Math.min(scenarios[i].l + 2, 13));
          const { wp, lp } = calcPoints(gc.w, gc.l, scenarios[i].wAdj, scenarios[i].lAdj);
          scenarios[i] = { ...scenarios[i], ...gc, wp, lp };
          changed = true; break;
        }
      }
      if (changed) break;
    }
    if (!changed) break;
  }

  // Labels based on gap magnitude and scenario index
  const favTitleName = teamTitle(favTeam, matchDispNames);
  const undTitleName = teamTitle(undTeam, matchDispNames);
  const t1TitleName  = teamTitle(team1,   matchDispNames);
  const t2TitleName  = teamTitle(team2,   matchDispNames);

  // Labels: A=fav wins big, B=fav wins close, C=und wins close, D=und wins big
  const labelsByGap = gapMag >= 0.35
    ? [
        `${favTitleName} wins as expected`,
        `${favTitleName} survives a scare`,
        `⚡ Upset — ${undTitleName} edges it`,
        `⚡ ${undTitleName} dominates`,
      ]
    : gapMag >= 0.15
    ? [
        `${favTitleName} wins comfortably`,
        `${favTitleName} holds on`,
        `${undTitleName} wins close`,
        `${undTitleName} takes it convincingly`,
      ]
    : [
        `${favTitleName} wins in a tight one`,
        `${favTitleName} edges it out`,
        `${undTitleName} edges it out`,
        `${undTitleName} wins in a tight one`,
      ];

  scenarios.forEach((s, i) => {
    s.label = labelsByGap[i];
    s.color = s.favWins ? 'blue' : 'amber';
  });

  /* Title line */
  const t1Title = teamTitle(team1, matchDispNames);
  const t2Title = teamTitle(team2, matchDispNames);
  // Edge case: both doubles teams share the same last name — fall back to first names
  const bothSameLast = isDoubles
    && team1.length > 1 && team2.length > 1
    && lastName(team1[0].name) === lastName(team1[1].name)
    && lastName(team2[0].name) === lastName(team2[1].name)
    && lastName(team1[0].name) === lastName(team2[0].name);
  const titleStr = bothSameLast
    ? `${firstName(team1[0].name)} & ${firstName(team1[1].name)} vs ${firstName(team2[0].name)} & ${firstName(team2[1].name)}`
    : `${t1Title} vs ${t2Title}`;

  const favShortName = teamShortName(favTeam);
  const expectedScore = spreadToGameCounts(expSpread).score;
  const probLine = `${esc(favShortName)} ${favPct}% fav · Expected ~${expectedScore}`;

  /* ── Teams HTML ── */
  function teamColHtml(players, adjRating) {
    const avgBlock = (isDoubles && players.length > 1)
      ? `<div class="pc-team-avg">Team avg: ${Number(adjRating).toFixed(2)}</div>`
      : '';
    return avgBlock + players.map((p, i) => `
      ${i > 0 ? '<div class="pc-team-separator"></div>' : ''}
      <div class="pc-team-name">${esc(p.name)}</div>
      <div class="pc-team-rank">Rank ${rankLabel(p.rank)}</div>
      <div class="pc-team-rating">Rating ${Number(p.rating).toFixed(2)}</div>
      <div class="pc-team-pts">${p.points} pts</div>
    `).join('');
  }

  /* ── Scenario card HTML ── */
  function scenarioHtml(s) {
    const winnerShort = teamShortName(s.winTeam);
    const loserShort  = teamShortName(s.loseTeam);
    const winnerPct   = s.favWins ? favPct : (100 - favPct);
    const loserPct    = s.favWins ? (100 - favPct) : favPct;
    const probTag     = s.favWins
      ? `${esc(winnerShort)} ${winnerPct}% · ${esc(loserShort)} ${loserPct}%`
      : `${esc(loserShort)} ${loserPct}% · ⚡${esc(winnerShort)} ${winnerPct}%`;

    const winRows = s.winTeam.map(p =>
      `<div class="pc-sc-row">
        <span class="pc-sc-pts-earned">${esc(lastName(p.name))} +${s.wp}</span>
        <span class="pc-sc-pts-total"> (${p.points + s.wp})</span>
       </div>`
    ).join('');
    const loseRows = s.loseTeam.map(p =>
      `<div class="pc-sc-row">
        <span class="pc-sc-pts-earned">${esc(lastName(p.name))} +${s.lp}</span>
        <span class="pc-sc-pts-total"> (${p.points + s.lp})</span>
       </div>`
    ).join('');

    return `
      <div class="pc-scenario ${s.color}">
        <div class="pc-sc-label">${esc(s.label)}</div>
        <div class="pc-sc-score">~${esc(s.score)}</div>
        <div class="pc-sc-prob">${probTag}</div>
        ${winRows}
        ${loseRows}
      </div>`;
  }

  /* ── Footer ── */
  const footerLeft = watcher
    ? `${esc(watcher.name)} (${watcher.points} pts) watching nervously`
    : '';

  const html = `
    <div class="pc-header">
      <span class="pc-brand">🎾 Restoration Tennis Ladder</span>
      <span class="pc-badge">Match Preview</span>
    </div>

    <div class="pc-title-block">
      <div class="pc-eyebrow">${esc(typeLabel)} · What's At Stake</div>
      <div class="pc-main-title">${esc(titleStr)}</div>
      <div class="pc-prob-line">${probLine}</div>
    </div>

    <div class="pc-teams">
      <div class="pc-team left">${teamColHtml(team1, r1)}</div>
      <div class="pc-vs">VS</div>
      <div class="pc-team right">${teamColHtml(team2, r2)}</div>
    </div>

    <div class="pc-scenarios-label">What's At Stake</div>
    <div class="pc-scenarios-grid">
      ${scenarios.map(scenarioHtml).join('')}
    </div>

    <div class="pc-footer">
      <div class="pc-footer-left">${footerLeft}</div>
      <div class="pc-footer-right">restotennis.com</div>
    </div>
  `;

  document.getElementById('preview-card').innerHTML = html;
  document.title = `${titleStr} — Match Preview`;
}

/* ─── Bootstrap ─── */

(function() {
  const params = new URLSearchParams(window.location.search);
  const raw    = params.get('data');
  if (!raw) {
    document.getElementById('preview-card').innerHTML =
      '<div class="error-state">No match data found.<br><a href="index.html">← Back to ladder</a></div>';
    return;
  }
  try {
    const data = JSON.parse(decodeURIComponent(raw));
    render(data);
  } catch (e) {
    console.error('match-preview parse error', e);
    document.getElementById('preview-card').innerHTML =
      '<div class="error-state">Could not load preview.<br><a href="index.html">← Back to ladder</a></div>';
  }
})();

/* ── Console verification test cases ─────────────────────────────── */
(function verifyScenarios() {
  function testCase(r1t, r2t, label) {
    const g      = Math.min(Math.abs(r1t - r2t), 0.5);
    const exp    = g * 16;
    const favA   = Math.max(r1t, r2t);
    const undA   = Math.min(r1t, r2t);
    const tsp    = [exp + 4, Math.max(2, exp - 4), -4, -(exp + 4)];
    const rows   = tsp.map(sp => {
      const a = Math.round(Math.abs(sp));
      let w, l;
      if (a >= 10) { w = 12; l = 2; }
      else if (a === 9)  { w = 12; l = 3; }
      else if (a === 8)  { w = 12; l = 4; }
      else if (a === 7)  { w = 12; l = 5; }
      else if (a === 6)  { w = 12; l = 6; }
      else if (a === 5)  { w = 12; l = 7; }
      else if (a === 4)  { w = 12; l = 8; }
      else if (a === 3)  { w = 13; l = 10; }
      else if (a === 2)  { w = 13; l = 11; }
      else if (a === 1)  { w = 13; l = 12; }
      else               { w = 13; l = 13; }
      const wAdj = sp > 0 ? favA : undA;
      const lAdj = sp > 0 ? undA : favA;
      const { wp, lp } = calcPoints(w, l, wAdj, lAdj);
      return { sp: sp.toFixed(1), score: `${w}-${l}`, winner: sp > 0 ? 'fav' : 'und', wp, lp };
    });
    console.log(`[match-preview] ${label} (gap=${g.toFixed(3)}, expSpread=${exp.toFixed(1)}):`);
    rows.forEach((r, i) => {
      const idx = String.fromCharCode(65 + i);
      console.log(`  ${idx}: spread=${r.sp}  score=${r.score}  winner=${r.winner}  wp=${r.wp}  lp=${r.lp}`);
    });
    const wps = rows.map(r => (r.winner === 'fav' ? 1 : -1) * r.wp);
    const unique = new Set(wps).size === 4;
    console.log(`  → All four wp values distinct: ${unique ? '✓' : '✗'} [${wps.join(', ')}]`);
  }
  testCase(2.0625, 1.9375, 'Near-even (gap 0.125)');
  testCase(2.2,    1.8,    'Clear favorite (gap 0.4)');
})();
</script>
